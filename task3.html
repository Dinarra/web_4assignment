<div class="container mt-4">
    <h1>Contact form</h1>
    <form class="row g-3" action="#" method="post">
   <div class="col-md-6">
    <label for="name" class="form-label">Name:</label>
    <input type="text" class="form-control is-valid" id="name" placeholder="Dinara" required minlength="2" maxlength="50">
    <div class="valid-feedback">Looks good!</div>
    <div class="invalid-feedback">Please enter your full name (2-50 characters).</div>
</div>
   <div class="col-md-6">
    <label for="email" class="form-label">Email:</label>
    <input type="email" class="form-control is-valid" id="email" placeholder="dinara@example.com" required>
    <div class="valid-feedback">Looks good!</div>
    <div class="invalid-feedback">Please enter a valid email address.</div>
</div>
   <div class="col-12">
    <label for="message" class="form-label">Message:</label>
    <textarea class="form-control" id="message" rows="4" placeholder="Enter your message" required minlength="10" maxlength="200"></textarea>
   </div>
   <div class="col-12">
    <button type="submit" class="btn btn-primary">Submit</button>
   </div>
    </form>
</div>
